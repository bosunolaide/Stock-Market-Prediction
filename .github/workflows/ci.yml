name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: |
          ruff check backend/src backend/flows backend/tests

      - name: Tests (pytest)
        run: |
          pytest -q
