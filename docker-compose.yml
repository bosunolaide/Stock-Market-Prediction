services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_EXPERIMENT=stock-forecast
      - PUSHGATEWAY_URL=http://pushgateway:9091
      - LOG_LEVEL=INFO
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
    depends_on:
      - mlflow
      - pushgateway
    networks:
      - stocknet

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - stocknet

  # --- MLOps stack ---
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=mlflow
      - POSTGRES_PASSWORD=mlflow
      - POSTGRES_DB=mlflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - stocknet

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data
    networks:
      - stocknet

  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin) do echo '...waiting...' && sleep 2; done;
      /usr/bin/mc mb -p local/stock-mlops || true;
      /usr/bin/mc anonymous set download local/stock-mlops || true;
      exit 0;
      "
    networks:
      - stocknet

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.3
    depends_on:
      - postgres
      - minio
      - createbuckets
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql+psycopg2://mlflow:mlflow@postgres:5432/mlflow
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=s3://stock-mlops
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri $$MLFLOW_BACKEND_STORE_URI
      --default-artifact-root $$MLFLOW_DEFAULT_ARTIFACT_ROOT
    networks:
      - stocknet

  pushgateway:
    image: prom/pushgateway:v1.8.0
    ports:
      - "9091:9091"
    networks:
      - stocknet

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - pushgateway
    networks:
      - stocknet

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - stocknet

networks:
  stocknet:
    driver: bridge

volumes:
  pgdata:
  minio:
  grafana:
