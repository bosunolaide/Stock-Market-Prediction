version: '3.9'
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    networks:
      - stocknet
  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - stocknet
networks:
  stocknet:
    driver: bridge
